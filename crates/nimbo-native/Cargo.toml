[package]
name = "nimbo-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native OS capabilities for NimboGuide, exposed to Node through N-API."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.15", default-features = false, features = ["napi6"] }
napi-derive = "3.6"
nimbo-gestures = { path = "../nimbo-gestures" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[build-dependencies]
napi-build = "2.6"

[lints]
workspace = true
